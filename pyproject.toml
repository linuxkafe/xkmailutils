[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mailutils"
version = "0.1.0"
description = "Gerador de assinaturas de email compatíveis com filtros de spam"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.101",
    "uvicorn>=0.23",
    "jinja2>=3.1",
    "itsdangerous>=2.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
# `playwright` é a única dependência que este projecto acrescenta depois do
# arranque, e entra só aqui: em desenvolvimento, para o suite E2E (T008). Não
# entra em `dependencies` e portanto não vai para produção. Declarar-se em vez
# de "usar se estiver instalada" pelo mesmo motivo que endureci o format-check:
# uma dependência implícita torna o gate dependente do estado da máquina, e um
# gate que depende da máquina não é um gate.
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.24", "ruff>=0.4", "playwright>=1.40"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Os templates e a folha de estilo são *dados* de que a aplicação precisa em
# tempo de execução. Sem esta secção, um `pip install .` instala o código e
# deixa de fora os templates — e a falha só aparece no arranque, na primeira
# renderização, como um `TemplateNotFound`.
mailutils = ["templates/*.html", "static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mailutils --cov-report=term-missing --cov-report=xml"
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:mailutils.*"]

[tool.coverage.run]
branch = true
source = ["src/mailutils"]
omit = ["*/templates/*", "*/static/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "RET", "SIM"]
ignore = [
    "S101",  # assert — usado em testes e invariantes internas
    "B008",  # chamada em default de FastAPI é o padrão do framework
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"e2e/*" = ["S105", "S106", "S311"]

[tool.ruff.format]
quote-style = "double"
