name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: make setup

      # `make check` inclui `e2e-check`, que precisa do Chromium. `make setup`
      # instala o pacote `playwright` mas não o browser — este passo é o que
      # separa "o pacote está instalado" de "o browser existe". Sem ele a CI
      # fica vermelha no primeiro run, que é o F-03. (F-03)
      - name: Install browser
        run: python3 -m playwright install --with-deps chromium

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Quality gates
        run: make check

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          fail_ci_if_error: false

      - name: Security audit
        run: pip install pip-audit --quiet && pip-audit || true
