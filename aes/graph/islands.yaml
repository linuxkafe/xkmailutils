# Island graph — as claims que a revisão de 2026-10-02 falsificou
#
# Este ficheiro é a generalização do que a revisão encontrou. Os quatro BLOCKER
# não eram quatro bugs: eram quatro **afirmações** que o código não sustentava,
# escritas com a certeza de quem fez o trabalho. Um ficheiro que as lista com a
# evidência que as mede é a diferença entre "corrigi o bug" e "o sistema sabe
# que o bug existe".
#
# ## Porque não há Z3 aqui
#
# `aes-epistemics` propõe `make gmif-check` com o Z3 a resolver `logical_form`.
# Não foi ligado, e a razão está em `NFR-10`: dependências novas são zero, e o
# Z3 é uma dependência nova. Houve uma segunda razão, que é mais séria.
#
# Estas claims não são tautologias lógicas. "Se `confirmed_at IS NULL`, ninguém
# recebe" não é uma fórmula que o Z3 refute — é uma afirmação sobre **o que o
# código faz**, e o código responde-se com uma mutação: trocar a condição por
# `1=1` e ver se os testes ficam vermelhos. A M-18 é isso, e é mais forte do que
# um solver: não prova que o código satisfaz a fórmula, prova que **os testes
# detectam quando deixa de satisfazer**. Um UNSAT aqui provaria que a
# codificação está certa, não que o produto está.
#
# A validação externa — correr o comando e ver o resultado — é a que se usa.
# `validation_type: human` é o que sobra, e é honesto: nenhuma máquina neste
# projecto abre um email num Thunderbird.
#
# `scripts/epistemics-check.sh` corre isto. Não entra em `make check` porque
# `mutation-check` lá está e faz o mesmo trabalho por mutação; duplicar o custo
# não compra cobertura.

