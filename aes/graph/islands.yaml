    anchor: "tests/golden/stack.html"
    evidence: >-
      M-23 em scripts/run-mutations.py — `display:inline-block` passa a
      `display:inline`. É a mutação de um byte que passava com 744 testes
      verdes.
    falsified_by: "M-23 sobreviver"
    note: >-
      Esta claim esteve `FALSIFIED` e classificada como `human`, e ambas as
      coisas estavam erradas. Não precisava de olhos: precisava de um HTML
      dourado, e o `human-validation.sh` não o produz. A classificação
      `validation_type` é uma afirmação sobre **quem pode fechar** uma claim —
      dizer que só uma pessoa pode fechar é dizer que a máquina não pode, e
      nesse caso a máquina não pode porque o fecho não foi escrito. Escrever o
      fecho muda a classificação.
    last_verified: "2026-10-02T13:50:00Z"
    tickets: [T013]

